{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Admin - Replica Assist</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
    --primary: #2b98b3;
    --primary-hover: #257f96;
    --success: #22c55e;
    --danger: #dc2626;
    --surface: #ffffff;
    --surface-muted: #f8fafc;
    --border: #e5eff6;
    --text: #0f172a;
    --text-muted: #64748b;
    --shadow: 0 18px 40px rgba(15,23,42,0.06);
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family: "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f5f7fa;
    color: var(--text);
}

button, input, textarea, select {
    font: inherit;
}

.layout {
    display: flex;
    min-height: 100vh;
}

.sidebar {
    width: 260px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 32px 20px;
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.sidebar img {
    width: 140px;
    margin-bottom: 10px;
}

.menu-item {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 16px;
    border-radius: 16px;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--text);
    transition: background 0.2s ease, transform 0.2s ease;
}

.menu-item:hover {
    background: #f1f9fd;
}

.menu-item.active {
    background: rgba(43,152,179,0.14);
    box-shadow: 0 8px 20px rgba(43,152,179,0.12);
}

.icon-circle {
    width: 34px;
    height: 34px;
    min-width: 34px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #eaf6fb;
    color: var(--primary);
    font-size: 0.95rem;
}

.main {
    flex: 1;
    padding: 32px 40px;
    display: grid;
    gap: 24px;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 24px;
    margin-bottom: 24px;
}

.topbar h1 {
    font-size: 1.75rem;
    margin: 0;
    line-height: 1.1;
    font-weight: 800;
}

.cards {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 20px;
    margin-bottom: 30px;
}

.card,
.card-pad,
.table-container {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 24px;
}

.card:hover,
.card-pad:hover {
    transform: translateY(-2px);
}

.card h3 {
    margin: 0;
    font-size: 1.35rem;
    color: var(--primary);
}

.card p {
    margin-top: 6px;
    color: var(--text-muted);
    font-size: 0.95rem;
}

.table-container {
    overflow-x: auto;
}

.table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    min-width: 640px;
}

.table th,
.table td {
    padding: 16px 18px;
    text-align: left;
    font-size: 0.95rem;
    color: var(--text);
}

.table th {
    background: var(--surface-muted);
    font-weight: 700;
    border-bottom: 1px solid #e9f0f6;
}

.table tbody tr {
    border-bottom: 1px solid #eef2f7;
}

.table tbody tr:last-child td {
    border-bottom: none;
}

.table tbody tr:hover {
    background: var(--surface-muted);
}

.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 0 18px;
    border-radius: 16px;
    border: 1px solid transparent;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    transition: transform 0.18s ease, background-color 0.18s ease, border-color 0.18s ease;
    text-decoration: none;
}

.btn:hover {
    transform: translateY(-1px);
}

.btn-primary {
    background: var(--primary);
    color: #ffffff;
}

.btn-primary:hover {
    background: var(--primary-hover);
}

.btn-secondary {
    background: #f8fafc;
    color: var(--text);
    border-color: #d2dae3;
}

.btn-secondary:hover {
    background: #eef6fb;
}

.btn-danger {
    background: var(--danger);
    color: #ffffff;
}

.btn-danger:hover {
    background: #b12820;
}

.btn-success {
    background: var(--success);
    color: #ffffff;
}

.btn-success:hover {
    background: #1b9f4a;
}

.btn-outline {
    background: transparent;
    color: var(--primary);
    border-color: var(--primary);
}

.btn-outline:hover {
    background: rgba(43,152,179,0.1);
}

.btn-light {
    background: #f8fafc;
    color: var(--text);
    border-color: #e2e8f0;
}

.btn-block {
    width: 100%;
}

.input,
textarea,
select,
input[type="search"],
input[type="date"],
input[type="file"] {
    width: 100%;
    min-height: 44px;
    border-radius: 14px;
    border: 1px solid #d1d7df;
    background: #ffffff;
    color: var(--text);
    padding: 12px 14px;
    font-size: 0.95rem;
    transition: border-color 0.18s ease, box-shadow 0.18s ease;
}

textarea {
    min-height: 120px;
    resize: vertical;
}

.input:focus,
textarea:focus,
select:focus,
input[type="search"]:focus,
input[type="date"]:focus,
input[type="file"]:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(43,152,179,0.14);
}

input::placeholder,
textarea::placeholder,
select::placeholder {
    color: #94a3b8;
}

.pill,
.status-pill,
.info-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 0.82rem;
    font-weight: 700;
}

.status-pill,
.info-badge {
    background: var(--primary);
    color: #ffffff;
}

.info-pill {
    background: #f1f5f9;
    color: var(--text);
}

.info-pill.green {
    background: #d1fae5;
    color: #065f46;
}

.info-pill.red {
    background: #fee2e2;
    color: #991b1b;
}

.info-pill.blue {
    background: #dbeafe;
    color: #1e40af;
}

.alert-panel {
    border-radius: 18px;
    background: #fef3c7;
    border: 1px solid #fde68a;
    padding: 18px 20px;
    color: #92400e;
    line-height: 1.6;
}

.label,
label,
.small {
    display: block;
    font-size: 0.88rem;
    font-weight: 600;
    color: #475569;
    margin-bottom: 8px;
}

.description-body,
.timeline-detail,
.card-note {
    font-size: 0.95rem;
    line-height: 1.8;
    color: #475569;
}

.timeline-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 18px;
}

.timeline-item {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 16px;
    align-items: flex-start;
}

.timeline-marker {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--primary);
    box-shadow: 0 0 0 8px rgba(43,152,179,0.12);
    margin-top: 6px;
}

.timeline-content {
    display: grid;
    gap: 8px;
}

.timeline-date {
    font-size: 0.82rem;
    color: #64748b;
}

.timeline-title {
    font-weight: 700;
    color: var(--text);
}

.timeline-empty {
    color: #64748b;
    font-style: italic;
}

.chat-layout {
    display: grid;
    grid-template-columns: 1.7fr 1fr;
    gap: 24px;
    align-items: start;
}

.chat-box {
    min-height: 500px;
    background: var(--surface-muted);
    border-radius: 20px;
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow: auto;
}

.chat-message {
    max-width: 80%;
    display: grid;
    gap: 10px;
    padding: 16px 18px;
    border-radius: 20px;
    box-shadow: 0 12px 30px rgba(15,23,42,0.08);
    line-height: 1.7;
    animation: slideUp 0.18s ease;
}

.chat-message-incoming {
    align-self: flex-start;
    background: #ffffff;
    color: var(--text);
}

.chat-message-outgoing {
    align-self: flex-end;
    background: var(--primary);
    color: #ffffff;
}

.chat-message-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    font-size: 0.85rem;
    font-weight: 700;
}

.chat-message-time {
    font-size: 0.78rem;
    opacity: 0.72;
}

.chat-message-body {
    white-space: pre-wrap;
    word-break: break-word;
}

.chat-file {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 14px;
    border-radius: 16px;
    background: rgba(255,255,255,0.18);
}

.chat-file a {
    color: inherit;
    text-decoration: none;
    font-weight: 600;
}

@keyframes slideUp {
    from { transform: translateY(8px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

.sidebar-column {
    display: grid;
    gap: 20px;
}

.sla-pill-row,
.info-row {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: center;
}

.progress-track {
    height: 10px;
    background: #e5e7eb;
    border-radius: 999px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: var(--success);
    transition: width 0.24s ease, background 0.24s ease;
}

.sla-timer {
    font-size: 1.05rem;
    font-weight: 800;
    margin-bottom: 12px;
    color: var(--text);
}

.rating-score {
    font-size: 2.8rem;
    font-weight: 800;
    color: #f59e0b;
    margin: 0;
}

.rating-note {
    background: #f8fafc;
    padding: 14px 16px;
    border-radius: 16px;
    color: #475569;
}

.card-center {
    max-width: 420px;
    margin: 0 auto;
}

.subtext {
    font-size: 0.95rem;
    color: #64748b;
    margin-bottom: 8px;
}

.hidden {
    display: none !important;
}

.mt-4 {
    margin-top: 16px;
}

@media (max-width: 1120px) {
    .layout { flex-direction: column; }
    .sidebar {
        width: 100%;
        position: relative;
        height: auto;
        padding: 22px 18px;
        border-right: none;
        border-bottom: 1px solid var(--border);
    }
    .main { padding: 24px 22px; }
    .chat-layout { grid-template-columns: 1fr; }
}

@media (max-width: 900px) {
    .cards { grid-template-columns: repeat(2, minmax(200px, 1fr)); }
    .table-container { padding: 18px; }
    .table { min-width: 0; }
}

@media (max-width: 720px) {
    .topbar { flex-direction: column; align-items: stretch; gap: 14px; }
    .cards { grid-template-columns: 1fr; }
    .btn { width: 100%; }
    .table th, .table td { padding: 12px 10px; }
    .input, textarea, select { min-height: 40px; }
}

</style>
</head>

<body>

<div class="layout">

    <div class="sidebar">
        <img src="{% static 'img/logo.png' %}" alt="Replica Logo">

        <a href="#" class="menu-item active">
            <div class="icon-circle">🏠</div>
            Dashboard
        </a>

        <a href="#" class="menu-item">
            <div class="icon-circle">🎫</div>
            Tickets
        </a>

        <a href="#" class="menu-item">
            <div class="icon-circle">👤</div>
            Usuarios
        </a>

        <a href="#" class="menu-item">
            <div class="icon-circle">🏢</div>
            Empresas
        </a>

        <a href="{% url 'logout' %}" class="menu-item">
            <div class="icon-circle">🚪</div>
            Cerrar sesión
        </a>

    </div>

    <div class="main">
        {% block content %}{% endblock %}
    </div>

</div>

</body>
</html>
