{% extends "base_admin.html" %}

{% block top_title %}
Comunicados
{% endblock %}

{% block content %}

<div class="card card-pad" style="max-width:900px;">

    <div style="
        font-size:24px;
        font-weight:900;
        margin-bottom:18px;
    ">
        Enviar comunicado
    </div>

    <form method="POST">

        {% csrf_token %}

        <div class="grid" style="gap:18px;">

            <div>
                <label class="small">
                    Asunto
                </label>

                <input
                    class="input"
                    type="text"
                    name="title"
                    required
                >
            </div>

            <div>
                <label class="small">
                    Mensaje
                </label>

                <textarea
                    class="input"
                    name="body"
                    rows="8"
                    required
                ></textarea>
            </div>

            <div style="
                display:flex;
                justify-content:flex-end;
            ">

                <button class="btn" type="submit">
                    📢 Enviar comunicado
                </button>

            </div>

        </div>

    </form>

</div>

{% endblock %}
