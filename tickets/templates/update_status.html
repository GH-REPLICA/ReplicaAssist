{% extends "base_admin.html" %}
{% block top_title %}Gestión{% endblock %}
{% block content %}

<div class="card card-pad">
  <div style="font-size:24px;font-weight:900;margin-bottom:6px;">Actualizar Ticket</div>
  <div class="small" style="margin-bottom:16px;">Cambia estado, prioridad, severidad o reasigna soporte.</div>

  <form method="POST" onsubmit="return confirm('¿Confirmas cambiar el estado del ticket?')" class="grid grid-2">
    {% csrf_token %}

    <div>
      <label class="small">Estado</label>
      {{ form.status }}
    </div>

    <div>
      <label class="small">Asignado a</label>
      {{ form.assigned_to }}
    </div>

    <div>
      <label class="small">Prioridad</label>
      {{ form.priority }}
    </div>

    <div>
      <label class="small">Severidad</label>
      {{ form.severity }}
    </div>

    <div style="grid-column:1/3;display:flex;gap:10px;justify-content:flex-end;margin-top:10px;">
      <a class="btn light" href="{% url 'ticket_detail' ticket.id %}">Volver</a>
      <button class="btn" type="submit">Guardar</button>
    </div>
  </form>
</div>

{% endblock %}
